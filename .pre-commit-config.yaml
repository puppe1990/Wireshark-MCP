# Hooks locais: usam o ruff/pytest do .venv (pip install -r requirements-dev.txt).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (lint)
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]
      - id: pytest
        name: pytest (suíte completa)
        entry: .venv/bin/python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
